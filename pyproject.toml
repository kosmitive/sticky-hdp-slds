[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[project]
name = "sticky-hdp-slds"
version = "0.1.0"
description = "Sticky hierarchical Dirichlet process switching linear dynamical system (Fox et al., arXiv:1003.3829)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Markus Semmler" }]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.7",
    "matplotlib>=3.5",
]
keywords = ["bayesian-nonparametrics", "slds", "hidden-markov-model", "time-series"]

[dependency-groups]
dev = [
    "pytest>=7",
    "ruff>=0.6",
    "pre-commit>=3",
    "mypy>=1.11",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
packages = ["sticky_hdp_slds"]
ignore_missing_imports = true
warn_unused_ignores = true
show_error_codes = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "data", "debug", "test_runner"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
